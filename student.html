<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Playwrite+AU+SA+Guides&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Smooch+Sans:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        #resultMessage {
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            font-weight: lighter;
        }

        body {
            min-height: 100vh;
            display: flex;
            font-family: 'poppins', sans-serif;
            justify-content: center;
            align-items: center;
        }

        .container {
            padding: 1rem;
            margin: 1rem;
            font-size: 20px;
            width: 90%;
            color: white;
            max-width: 450px;
            border-radius: 15px;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3)), url(https://images.unsplash.com/photo-1746729739298-986d64528894?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);
            background-position: center;
            background-size: cover;
            box-sizing: border-box;
        }

        .result-card {
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }

        button {
            padding: 10px;
            width: 100%;
            text-align: center;
            background-color: rgba(9, 120, 217, 0.837);
            color: blanchedalmond;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: transparent;
        }

        input {
            width: 100%;
            height: 40px;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 1rem;
            background-color: black;
            color: white;
        }

    </style>
    <div class="container">
        <div class="result-card">
            <h2>Student Grade Checker</h2>
                <p> Determine Your Grade and Score</p>

                <form id="resultform">
                    <label for="name">Your Name:</label>
                    <input type="text" placeholder="Your Name" required id="StudentName"> <br>
                    <label for="Score">Your Score:</label>
                     <input type="number" required placeholder="Your Score" id="studentScore"> <br>
                         <button type="submit">Check Grade</button>
                </form>
                <p id="resultMessage"></p>
        </div>
    </div>

    <script>
              const form = document.getElementById("resultform");
        const StudentName = document.getElementById("StudentName");
        const studentScore = document.getElementById("studentScore");
        const resultMessage = document.getElementById("resultMessage");


        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const name = StudentName.value.trim();
            const score =  Number(studentScore.value);

            if (name === "") {
                resultMessage.textContent = "Please provide your details.";
            }
            else if (studentScore.value === "") {
                resultMessage.textContent = "please enter your score";
            }

            else if (score < 0 || score > 100) {
                resultMessage.textContent = "please enter a score between 0 and 100.";
                textContent.style.color = red;
            }

            else if (score >= 70) {
                resultMessage.textContent = name + " " + "A+!.";
                resultMessage.style.color = "green";
            }
            else if (score >= 50) {
                resultMessage.textContent = name + " " + "B!.";
                resultMessage.style.color = "blue";
            }
            else if (score >= 40) {
                resultMessage.textContent = name + " " + "C!.";
                resultMessage.style.color = "yellow";
            }

            else {
                resultMessage.textContent = name + " " + "F!.";
                resultMessage.style.color = "red";
            }
            form.reset();
        });
    </script>
</body>
</html>
